<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - Advanced Servlet</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f3f4f6;
            margin: 0;
            padding: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #111827;
        }
        .card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            width: 100%;
            max-width: 580px;
            padding: 28px;
        }
        .header {
            text-align: center;
            margin-bottom: 22px;
        }
        h2 {
            margin: 0 0 6px 0;
            font-size: 22px;
            color: #111827;
        }
        p.subtitle {
            margin: 0;
            font-size: 13px;
            color: #6b7280;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }
        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        label {
            font-size: 13px;
            font-weight: 600;
            color: #374151;
        }
        input[type="text"],
        select {
            padding: 9px 12px;
            font-size: 13px;
            border: 1px solid #d1d5db;
            border-radius: 5px;
            outline: none;
            background: #fff;
            color: #111827;
            transition: border-color 0.15s;
        }
        input[type="text"]:focus,
        select:focus {
            border-color: #2563eb;
        }
        .checkbox-group {
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            padding: 12px 14px;
            background: #f9fafb;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .checkbox-title {
            font-size: 13px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 2px;
        }
        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #4b5563;
            cursor: pointer;
        }
        .checkbox-item input[type="checkbox"] {
            cursor: pointer;
            width: 16px;
            height: 16px;
            accent-color: #2563eb;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 6px;
        }
        button.btn-submit {
            flex: 1;
            padding: 11px;
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
            background: #2563eb;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s;
        }
        button.btn-submit:hover {
            background: #1d4ed8;
        }
        a.btn-view {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            padding: 11px 16px;
            font-size: 13px;
            font-weight: 600;
            color: #374151;
            background: #f3f4f6;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            text-decoration: none;
            transition: background 0.15s;
        }
        a.btn-view:hover {
            background: #e5e7eb;
        }
        .footer-note {
            margin-top: 18px;
            text-align: center;
            font-size: 11px;
            color: #9ca3af;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <h2>Student Registration</h2>
        <p class="subtitle">Advanced Jakarta Servlet + JDBC SQL Database Integration</p>
    </div>

    <!-- 4 Inputs: Name, ID, Department, Subjects (Checkbox) -->
    <form action="register" method="POST">
        <div class="form-row">
            <div class="field">
                <label for="id">Student ID *</label>
                <input type="text" id="id" name="id" required placeholder="e.g. STU101">
            </div>
            <div class="field">
                <label for="name">Student Name *</label>
                <input type="text" id="name" name="name" required placeholder="e.g. Alice Johnson">
            </div>
        </div>

        <div class="field">
            <label for="department">Department *</label>
            <select id="department" name="department" required>
                <option value="" disabled selected>Select Department</option>
                <option value="Computer Science">Computer Science</option>
                <option value="Information Technology">Information Technology</option>
                <option value="Artificial Intelligence & Data Science">Artificial Intelligence & Data Science</option>
                <option value="Electronics & Communication">Electronics & Communication</option>
                <option value="Mechanical Engineering">Mechanical Engineering</option>
            </select>
        </div>

        <div class="checkbox-group">
            <div class="checkbox-title">Enrolled Subjects (Select all that apply)</div>
            <label class="checkbox-item">
                <input type="checkbox" name="subjects" value="Java & Jakarta Servlets" checked>
                Java & Jakarta Servlets
            </label>
            <label class="checkbox-item">
                <input type="checkbox" name="subjects" value="Database Management & SQL">
                Database Management & SQL
            </label>
            <label class="checkbox-item">
                <input type="checkbox" name="subjects" value="Web Technologies">
                Web Technologies
            </label>
            <label class="checkbox-item">
                <input type="checkbox" name="subjects" value="Data Structures & Algorithms">
                Data Structures & Algorithms
            </label>
            <label class="checkbox-item">
                <input type="checkbox" name="subjects" value="Cloud Computing & DevOps">
                Cloud Computing & DevOps
            </label>
        </div>

        <div class="button-group">
            <button type="submit" class="btn-submit">Register & Save to SQL</button>
            <a href="register" class="btn-view">View SQL Table</a>
        </div>
    </form>

    <div class="footer-note">
        Powered by Apache Tomcat 11 &bull; Jakarta Servlet 6.0 &bull; JDBC H2/SQL Engine
    </div>
</div>

</body>
</html>
